name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  check-vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vendor drift-check
        run: node scripts/check-shared-vendor.mjs

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Mobile typecheck
        run: |
          cd packages/supabase && npm install --legacy-peer-deps
          cd ../core && npm install --legacy-peer-deps
          cd ../../apps/mobile && npm install --legacy-peer-deps && npm run typecheck

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Exercises the real Vite/rollup production build (vercel.json's
      # buildCommand) — tsc -b doesn't catch asset/import resolution breaks
      # that only surface at deploy time. (#674)
      - run: pnpm --filter @oga/web build
      # The dev-only Course Editor + ops dashboard (router.tsx) must never
      # reach a production bundle — that gate already failed silently once
      # on already-merged code. Fail the build instead of depending on
      # someone remembering to grep dist/ by hand.
      - name: Dev-admin bundle-leak guard
        run: '! grep -rqE ''dev-admin|dev-editor|/dev/courses|/dev/admin'' apps/web/dist'
