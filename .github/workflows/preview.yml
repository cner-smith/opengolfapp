name: Preview
on:
  pull_request:
    branches: [dev]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm test

  check-vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vendor drift-check
        run: node scripts/check-shared-vendor.mjs

  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Install supabase package deps
        run: cd packages/supabase && npm install --legacy-peer-deps
      - name: Install core package deps
        run: cd packages/core && npm install --legacy-peer-deps
      - name: Mobile typecheck
        run: cd apps/mobile && npm install --legacy-peer-deps && npm run typecheck

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      # Exercises the real Vite/rollup production build (vercel.json's
      # buildCommand) — tsc -b doesn't catch asset/import resolution breaks
      # that only surface at deploy time. (#674)
      - run: pnpm --filter @oga/web build
