# iOS live-round check. Run by .github/workflows/ios-check.yml after `simctl location` has put the
# simulator on Whistling Straits hole 1. Starts a live round, marks the ball, reaches the aim step,
# screenshots it, then deletes the round so the CI user stays clean (onFlowComplete runs on failure too).
appId: golf.oga.app
name: iOS live round — start, mark ball, aim, clean up
onFlowComplete:
  - runFlow:
      when:
        visible: "Skip tips"
      commands:
        - tapOn: "Skip tips"
  - runFlow:
      when:
        visible: "Round options"
      commands:
        - tapOn: "Round options"
        - tapOn: "Delete round"
        - tapOn: "Delete"
        - extendedWaitUntil:
            visible: "By the numbers"
            timeout: 30000
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sign in to OGA"
    timeout: 60000
- tapOn:
    below: "Email"
- inputText: ${E2E_EMAIL}
- tapOn:
    below: "Password"
- inputText: ${E2E_PASSWORD}
- tapOn: "Sign in to OGA"
- tapOn: "Sign in"
# iOS offers to save the password after sign-in and the sheet covers the app until dismissed.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "Skip splash|By the numbers|Skip intro tour"
    timeout: 60000
- runFlow:
    when:
      visible: "Skip splash"
    commands:
      - tapOn: "Skip splash"
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "By the numbers|Skip intro tour"
    timeout: 60000
- runFlow:
    when:
      visible: "Skip intro tour"
    commands:
      - tapOn: "Skip intro tour"
- extendedWaitUntil:
    visible: "By the numbers"
    timeout: 30000
# Signed in. The CI workflow publishes a run's failure screenshots only if this one exists (a failed login can
# leave typed credentials on screen).
- takeScreenshot: lr-00-signed-in
# A round left over from an earlier run replaces "Start live round" with a Resume banner on Home.
# The CI user is dedicated, so delete it rather than fail every later run.
- runFlow:
    when:
      visible: "Resume.*"
    commands:
      - tapOn: "Resume.*"
      - extendedWaitUntil:
          visible: "Round options|Skip tips"
          timeout: 30000
      - runFlow:
          when:
            visible: "Skip tips"
          commands:
            - tapOn: "Skip tips"
      - tapOn: "Round options"
      - tapOn: "Delete round"
      - tapOn: "Delete"
      - extendedWaitUntil:
          visible: "By the numbers"
          timeout: 30000
# Start a live round on Whistling Straits.
- tapOn: "Start live round"
- extendedWaitUntil:
    visible: "Pick a course to start"
    timeout: 30000
- tapOn: "Search courses…"
# Typed text is "Whistling" so the search box itself can't match the "Whistling Straits.*" row selector.
- inputText: "Whistling"
- takeScreenshot: lr-01-course-search
- tapOn: "Whistling Straits.*"
# A multi-course facility shows a unit list first (‹ Back is visible); pick the first unit under it.
- runFlow:
    when:
      visible: "‹ Back"
    commands:
      - takeScreenshot: lr-01b-course-units
      - tapOn:
          below: "‹ Back"
- tapOn: "Start round →"
# First visit: the round-screen tips open over everything.
- extendedWaitUntil:
    visible: "Mark my ball.*|Waiting for GPS…|Skip tips"
    timeout: 60000
- runFlow:
    when:
      visible: "Skip tips"
    commands:
      - takeScreenshot: lr-02-tips
      - tapOn: "Skip tips"
- extendedWaitUntil:
    visible: "Mark my ball.*"
    timeout: 60000
- takeScreenshot: lr-03-live-before-mark
- tapOn: "Mark my ball.*"
# The aim-step tips open ~700 ms later on a fresh install; dismiss them so the screenshot shows the map.
- extendedWaitUntil:
    visible: "Skip tips"
    timeout: 4000
    optional: true
- runFlow:
    when:
      visible: "Skip tips"
    commands:
      - takeScreenshot: lr-04a-aim-tips
      - tapOn: "Skip tips"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: lr-04-aim
