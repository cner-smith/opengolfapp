# Edit on map: drag a shot's start, then tap Done at once on a slow network (#1113). The review
# must open with the moved start, not reload the one from before the move.
appId: app.opengolf.oga
name: Android live round — Done right after a move shows the moved start
onFlowComplete:
  - runFlow:
      file: subflows/net.yaml
      env: { NET: off }
  - runFlow:
      when:
        visible: "Close and edit shots on the map"
      commands:
        - tapOn: "Close and edit shots on the map"
  - runFlow:
      when:
        visible: "Round options"
      commands:
        - tapOn: "Round options"
        - tapOn: "Delete round"
        - tapOn: "Delete"
---
- runFlow: subflows/home.yaml
- runFlow:
    file: subflows/gps.yaml
    env: { LAT: "43.849856", LNG: "-87.734575" }
- runFlow:
    file: subflows/start-round.yaml
    env: { MODE: "Just track my round" }
- tapOn: "Mark my ball at my GPS spot"
- runFlow: subflows/skip-tips.yaml
- runFlow:
    file: subflows/gps.yaml
    env: { LAT: "43.84906", LNG: "-87.7330" }
- tapOn: "Mark my ball at my GPS spot"
- runFlow:
    file: subflows/gps.yaml
    env: { LAT: "43.84869", LNG: "-87.73223" }
- tapOn: "Mark my ball at my GPS spot"
- tapOn: "Finish hole"
- runFlow: subflows/skip-tips.yaml
- assertVisible: "39[0-9] yd to pin"
- tapOn: "Close and edit shots on the map"
- runFlow: subflows/skip-tips.yaml
- assertVisible: "Shot 1 of 3"
- runFlow:
    file: subflows/net.yaml
    env: { NET: slow }
# Shot 1's start sits mid-map; drag it up the hole, then Done straight away.
- runFlow:
    file: subflows/drag.yaml
    env: { X: "540", Y: "1430", DX: "0", DY: "-400" }
- tapOn: "Back to the hole review"
- extendedWaitUntil:
    visible: "Save & next hole"
    timeout: 30000
# The tee start (39x yd out) is gone: shot 1 now starts where it was dragged.
- assertNotVisible: "39[0-9] yd to pin"
- tapOn: "Save & next hole"
- extendedWaitUntil:
    visible: "Hole 2"
    timeout: 30000
