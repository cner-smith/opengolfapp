# #1115: every played hole opens one played-hole mode (Add, drag, Delete): the hole still in play
# after a peek away (with Resume playing back to live capture) and an unfinished hole behind the
# furthest one. Its tips explain the drag; the distance to the pin follows the selected shot.
appId: app.opengolf.oga
name: Android live round — every played hole opens played-hole mode
onFlowComplete:
  - runFlow:
      when:
        visible: "Round options"
      commands:
        - tapOn: "Round options"
        - tapOn: "Delete round"
        - tapOn: "Delete"
---
- runFlow: subflows/home.yaml
- runFlow:
    file: subflows/gps.yaml
    env: { LAT: "43.849856", LNG: "-87.734575" }
- runFlow:
    file: subflows/start-round.yaml
    env: { MODE: "Just track my round" }
- tapOn: "Mark my ball at my GPS spot"
- runFlow: subflows/skip-tips.yaml
- runFlow:
    file: subflows/gps.yaml
    env: { LAT: "43.84906", LNG: "-87.7330" }
- tapOn: "Mark my ball at my GPS spot"
# Peek at hole 2 and come back: hole 1 is still in play, and opens played-hole mode.
- tapOn: "Next hole"
- runFlow: subflows/skip-tips.yaml
- extendedWaitUntil:
    visible: "Hole 2"
    timeout: 10000
- tapOn: "Previous hole"
- runFlow: subflows/skip-tips.yaml
- extendedWaitUntil:
    visible: "Shot 1 of 2"
    timeout: 10000
- assertVisible: "Add a shot after this one"
- tapOn: "Resume playing"
- assertVisible: "Finish hole"
- assertVisible: "Mark my ball.*"
# Leave hole 1 unfinished and finish hole 2: hole 1 is now behind the furthest hole.
- tapOn: "Next hole"
- runFlow: subflows/skip-tips.yaml
- extendedWaitUntil:
    visible: "Hole 2"
    timeout: 10000
- runFlow:
    file: subflows/gps.yaml
    env: { LAT: "43.8495", LNG: "-87.7340" }
- tapOn: "Mark my ball.*"
- tapOn: "Finish hole"
- runFlow: subflows/skip-tips.yaml
- tapOn: "Save & next hole"
- extendedWaitUntil:
    visible: "Hole 3"
    timeout: 30000
- runFlow: subflows/skip-tips.yaml
- tapOn: "Previous hole"
- extendedWaitUntil:
    visible: "Shot 1 of 1"
    timeout: 10000
- runFlow: subflows/skip-tips.yaml
- tapOn: "Previous hole"
- runFlow: subflows/skip-tips.yaml
- extendedWaitUntil:
    visible: "Hole 1"
    timeout: 10000
- assertVisible: "Shot 1 of 2"
- assertVisible: "Add a shot after this one"
- assertVisible: "Resume playing"
- tapOn: "What's on this screen"
- assertVisible: "Drag a shot’s start on the map to move it.*"
- tapOn: "Skip tips"
# Shot 1 starts on the tee (397 yd hole); shot 2 about 228 yd out.
- assertVisible: "39[0-9]\\.[0-9] yd to the pin"
- tapOn: "Next shot"
- assertVisible: "Shot 2 of 2"
- assertVisible: "22[0-9]\\.[0-9] yd to the pin"
