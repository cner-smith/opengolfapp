# #1090: after OB → Undo the ball must follow GPS again, so the next shot starts where the player
# walked to (on the course it was saved at the previous start).
appId: app.opengolf.oga
name: Android live round — OB, Undo, the ball follows GPS
onFlowComplete:
  - runFlow:
      when:
        visible: "Close and edit shots on the map"
      commands:
        - tapOn: "Close and edit shots on the map"
  - runFlow:
      when:
        visible: "Round options"
      commands:
        - tapOn: "Round options"
        - tapOn: "Delete round"
        - tapOn: "Delete"
---
- runFlow: subflows/home.yaml
- runFlow:
    file: subflows/gps.yaml
    env: { LAT: "43.849856", LNG: "-87.734575" }
- runFlow:
    file: subflows/start-round.yaml
    env: { MODE: "Track shot patterns" }
- runFlow: subflows/mark-and-aim.yaml
- runFlow:
    file: subflows/gps.yaml
    env: { LAT: "43.84906", LNG: "-87.7330" }
- extendedWaitUntil:
    visible: "OB"
    timeout: 20000
- tapOn: "OB"
# Stroke and distance: the ball goes back to the tee.
- extendedWaitUntil:
    visible: "39[0-9].* yd to the pin"
    timeout: 20000
- tapOn: "Undo"
# After Undo the ball is back on GPS, and the dock says so.
- assertVisible: "Mark my ball at my GPS spot"
- runFlow:
    file: subflows/gps.yaml
    env: { LAT: "43.84869", LNG: "-87.73223" }
- runFlow: subflows/mark-and-aim.yaml
- tapOn: "Finish hole"
- runFlow: subflows/skip-tips.yaml
# OB undone: two shots, the second from where the player walked to (not the tee again).
- assertNotVisible: "Shot 3"
- assertVisible: "14[0-9] yd to pin"
