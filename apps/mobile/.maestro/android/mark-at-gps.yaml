# Mark at my GPS spot saves the latest GPS fix. After a walk the smoothed ball trails the player
# (here ~180 yd shown while standing ~147 yd out); the start must be where they stand.
appId: app.opengolf.oga
name: Android live round — Mark at my GPS spot saves GPS
onFlowComplete:
  - runFlow:
      when:
        visible: "Close and edit shots on the map"
      commands:
        - tapOn: "Close and edit shots on the map"
  - runFlow:
      when:
        visible: "Round options"
      commands:
        - tapOn: "Round options"
        - tapOn: "Delete round"
        - tapOn: "Delete"
---
- runFlow: subflows/home.yaml
- runFlow:
    file: subflows/gps.yaml
    env: { LAT: "43.849856", LNG: "-87.734575" }
- runFlow:
    file: subflows/start-round.yaml
    env: { MODE: "Track shot patterns" }
- runFlow: subflows/mark-and-aim.yaml
- runFlow:
    file: subflows/gps.yaml
    env: { LAT: "43.84906", LNG: "-87.7330" }
- runFlow:
    file: subflows/gps.yaml
    env: { LAT: "43.84869", LNG: "-87.73223" }
- runFlow: subflows/mark-and-aim.yaml
- tapOn: "Finish hole"
- runFlow: subflows/skip-tips.yaml
- assertVisible: "14[0-9] yd to pin"
