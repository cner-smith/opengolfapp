# A 2 yd drag on the live ball moves it (#1111): drags under 5 yd used to be dropped while the
# marker looked moved.
appId: app.opengolf.oga
name: Android live round — a 2 yd ball drag moves the ball
onFlowComplete:
  - runFlow:
      when:
        visible: "Round options"
      commands:
        - tapOn: "Round options"
        - tapOn: "Delete round"
        - tapOn: "Delete"
---
- runFlow: subflows/home.yaml
- runFlow:
    file: subflows/gps.yaml
    env: { LAT: "43.849856", LNG: "-87.734575" }
- runFlow:
    file: subflows/start-round.yaml
    env: { MODE: "Just track my round" }
# Recentering frames the ball mid-map, about 5.4 px a yard.
- tapOn: "Put the ball on my GPS spot"
- copyTextFrom: ".* yd to the pin"
- evalScript: ${output.before = maestro.copiedText}
- runFlow:
    file: subflows/drag.yaml
    env: { X: "540", Y: "1432", DX: "0", DY: "-11" }
- assertNotVisible: ${output.before}
