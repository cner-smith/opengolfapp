# Moving the pin mid-hole keeps the camera on the ball (#1110). Signal: the OB prompt's ↑ arrow
# shows only while the last shot's marker is off screen, i.e. when the camera has gone to the tee.
appId: app.opengolf.oga
name: Android live round — moving the pin keeps the camera on the ball
onFlowComplete:
  - runFlow:
      when:
        visible: "Round options"
      commands:
        - tapOn: "Round options"
        - tapOn: "Delete round"
        - tapOn: "Delete"
---
- runFlow: subflows/home.yaml
- runFlow:
    file: subflows/gps.yaml
    env: { LAT: "43.849856", LNG: "-87.734575" }
- runFlow:
    file: subflows/start-round.yaml
    env: { MODE: "Track shot patterns" }
- runFlow: subflows/mark-and-aim.yaml
- runFlow:
    file: subflows/gps.yaml
    env: { LAT: "43.84869", LNG: "-87.73223" }
- runFlow: subflows/mark-and-aim.yaml
- extendedWaitUntil:
    visible: "Did shot 2 go out of bounds\\?"
    timeout: 10000
- tapOn: "Place pin"
- runFlow: subflows/skip-tips.yaml
- assertVisible: "Cancel pin placement"
# Pin mode zooms onto the green; tap a new pin spot there (placing it closes pin mode).
- tapOn:
    point: "65%,45%"
- extendedWaitUntil:
    notVisible: "Cancel pin placement"
    timeout: 5000
- waitForAnimationToEnd
- assertNotVisible: "↑ Did shot 2 go out of bounds\\?"
- assertVisible: "Did shot 2 go out of bounds\\?"
